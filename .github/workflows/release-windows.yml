name: Release Windows (Nachliefern)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v0.2.0)'
        required: true
        type: string
      target:
        description: 'Which Windows target to build'
        required: true
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64
    if: ${{ inputs.target == 'both' || inputs.target == 'x64' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Require a release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "tag must look like v1.2.3"
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify bundled wintun hashes
        run: node scripts/verify-wintun.mjs

      - name: Build Windows x64
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tauriArgs = @("tauri", "build", "--target", "x86_64-pc-windows-msvc")
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $tauriArgs += @("--config", "src-tauri/tauri.updater.json") }
          pnpm @tauriArgs

      - name: Verify Windows x64 bundle
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./scripts/verify-windows-bundle.ps1 -Arch x64

      - name: Stage files that exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-release
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist-release
          Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig, src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig -ErrorAction SilentlyContinue | Copy-Item -Destination dist-release

      - name: Upload to existing release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist-release/*
            dist-release/**/*

  build-windows-arm64:
    name: Windows ARM64
    if: ${{ inputs.target == 'both' || inputs.target == 'arm64' }}
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Require a release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "tag must look like v1.2.3"
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: aarch64-pc-windows-msvc

      - name: Install frontend deps
        shell: pwsh
        run: |
          # node-gyp on windows-11-arm cannot see this runner's Visual Studio.
          # Skip install scripts and rebuild only esbuild, which Vite needs.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild

      - name: Verify bundled wintun hashes
        run: node scripts/verify-wintun.mjs

      - name: Build Windows ARM64
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tauriArgs = @("tauri", "build", "--target", "aarch64-pc-windows-msvc")
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $tauriArgs += @("--config", "src-tauri/tauri.updater.json") }
          pnpm @tauriArgs

      - name: Verify Windows ARM64 bundle
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./scripts/verify-windows-bundle.ps1 -Arch arm64

      - name: Stage files that exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe dist-release
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi dist-release
          Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.sig, src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.sig -ErrorAction SilentlyContinue | Copy-Item -Destination dist-release

      - name: Upload to existing release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist-release/*
            dist-release/**/*
