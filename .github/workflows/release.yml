name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: pnpm install

      - name: Generate icons
        run: pnpm tauri icon src/assets/icon.svg

      - name: Build macOS universal
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: pnpm install

      - name: Generate icons
        run: pnpm tauri icon src/assets/icon.svg

      - name: Build Windows x64
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install LLVM
        run: choco install llvm -y
        shell: pwsh

      - name: Add LLVM to PATH
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-gnullvm

      - name: Install frontend deps
        run: pnpm install

      - name: Generate icons
        run: pnpm tauri icon src/assets/icon.svg

      - name: Build Windows ARM64
        run: pnpm tauri build --target aarch64-pc-windows-gnullvm
        env:
          CC_aarch64_pc_windows_gnullvm: clang
          CXX_aarch64_pc_windows_gnullvm: clang++
          AR_aarch64_pc_windows_gnullvm: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: lld-link

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-gnullvm/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-gnullvm/release/bundle/msi/*.msi

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: always() && needs.build-macos.result == 'success' && needs.build-windows-x64.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/macos-universal/**/*
            release-artifacts/windows-x64/**/*
            release-artifacts/windows-arm64/**/*
